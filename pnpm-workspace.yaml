packages:
  - server

allowBuilds:
  "@swc/core": true
  esbuild: true

minimumReleaseAge: 10080 # 1 week in minutes

overrides:
  brace-expansion@^2: ">=2.1.4"
  brace-expansion@^5: ">=5.0.9"
  vite@*: "catalog:"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
